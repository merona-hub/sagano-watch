name: Kusama ticket watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      last:
        description: "Days already open in the previous run (set by the watcher)"
        type: string
        default: ""

permissions:
  actions: write

concurrency:
  group: kusama-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check tickets
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LAST_OPEN: ${{ inputs.last }}
        run: |
          set +e
          python3 kusama.py
          code=$?
          if [ $code -eq 10 ]; then echo "done=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - name: Stop after the last day
        if: steps.check.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable kusama.yml --repo "$GITHUB_REPOSITORY"
      # GitHub's cron is unreliable, so each run starts the next one.
      - name: Keep watching
        if: ${{ !cancelled() && steps.check.outputs.done != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.check.outputs.state || inputs.last }}
        run: gh workflow run kusama.yml --repo "$GITHUB_REPOSITORY" -f last="$STATE"
