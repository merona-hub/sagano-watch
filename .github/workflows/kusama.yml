name: Kusama ticket watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: kusama-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check tickets
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set +e
          python3 kusama.py
          code=$?
          if [ $code -eq 10 ]; then echo "done=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - name: Stop watching after an alert
        if: steps.check.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable kusama.yml --repo "$GITHUB_REPOSITORY"
      # GitHub's cron is unreliable, so each run starts the next one.
      - name: Keep watching
        if: ${{ !cancelled() && steps.check.outputs.done != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kusama.yml --repo "$GITHUB_REPOSITORY"
